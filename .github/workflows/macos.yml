name: macOS Universal VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*-preview.*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          brew install cmake ninja
      - name: Verify source and catalogue integrity
        run: python3 -m unittest discover -s tests -v
      - name: Build Universal 2 VST3
        run: bash tools/build-macos.sh 2>&1 | tee macos-build.log
      - name: Native firmware, UI and state tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/macos-rust
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          uname -m
          cargo test --manifest-path .deps/fm1-desktop/crates/fm1-plugin/Cargo.toml --release --locked --lib --test catalogue --test portable -j 3 -- --nocapture 2>&1 | tee macos-tests.log
      - name: Official VST3 validation
        run: |
          cmake -S tools/validator -B build/macos-validator -G Ninja -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT="$PWD/build/macos/cpm/vst3sdk"
          cmake --build build/macos-validator --target validator --parallel 3
          # The pinned SDK puts Ninja executables in bin/<configuration> on macOS.
          build/macos-validator/bin/Release/validator 'dist/macos/VST3/Wave FM-1.vst3' 2>&1 | tee macos-validator.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          report = Path('macos-validator.log').read_text()
          if not re.search(r'Result: [1-9][0-9]* tests passed, 0 tests failed', report):
              raise SystemExit('Validator did not report completed, successful plugin tests')
          PY
          cp macos-validator.log dist/macos/VALIDATION.txt
          cp dist/macos/VALIDATION.txt dist/macos-downloads-validation.txt
      - name: Package verified bundle
        run: bash tools/package-macos.sh
      - name: Report build error context
        if: failure()
        run: |
          for log in macos-build.log macos-tests.log macos-validator.log; do
            if [[ -f "$log" ]]; then
              context=$(tail -n 30 "$log" | tr '\n' ' ')
              context=${context//%/%25}
              echo "::error title=$log context::$context"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wave-FM-1-macOS-Universal
          path: dist/macos-downloads/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download build from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Wave-FM-1-macOS-Universal
          path: artifacts
      - name: Attach verified macOS assets to the preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: ${{ github.ref_name }}
        run: |
          [[ "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || exit 1
          cd artifacts
          shasum -a 256 --check SHA256SUMS-macos
          if ! gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release create "$PREVIEW_TAG" --verify-tag --prerelease --title "Wave FM-1 Preview ${PREVIEW_TAG#v}" --notes 'Universal macOS VST3; see repository installation and validation documentation.' || gh release view "$PREVIEW_TAG" >/dev/null
          fi
          gh release upload "$PREVIEW_TAG" ./*.zip ./*.pkg SHA256SUMS-macos build-info-macos.json --clobber
