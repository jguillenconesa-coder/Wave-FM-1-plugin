name: Windows VST3 prototype
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Packaging integrity tests
        run: python -m unittest discover -s tests -v
      - name: Prepare pinned emulator
        run: python tools/bootstrap.py
      - name: Install Rust toolchain and advisory scanner
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit both dependency lockfiles
        run: |
          cargo audit --file .deps/fm1-emu/Cargo.lock
          cargo audit --file .deps/fm1-emu/crates/fm1-plugin/Cargo.lock
  build:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare pinned emulator
        run: python tools/bootstrap.py
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: CPU and peripheral tests
        run: cargo test --manifest-path .deps/fm1-emu/Cargo.toml --locked --release -p fm1-core -p fm1-soc -j 2
      - name: Build Windows CLAP and VST3
        shell: pwsh
        run: |
          try {
            & ./tools/build-windows.ps1 *>&1 | Tee-Object -FilePath msvc-build.log
          } finally {
            '### Windows build output (last 100 lines)' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            if (Test-Path msvc-build.log) { Get-Content msvc-build.log -Tail 100 >> $env:GITHUB_STEP_SUMMARY }
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Native catalogue and state tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.deps/fm1-emu/crates/fm1-plugin/target
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo test --manifest-path .deps/fm1-desktop/crates/fm1-plugin/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --lib --test catalogue --test portable -j 2 -- --nocapture
      - name: Official VST3 validation
        shell: pwsh
        run: |
          cmake -S tools/validator -B build/windows-validator -G 'Visual Studio 17 2022' -A x64 "-DVST3_SDK_ROOT=$PWD/build/windows/cpm/vst3sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Validator configuration failed' }
          cmake --build build/windows-validator --config Release --target validator --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Validator compilation failed' }
          & build/windows-validator/bin/Release/validator.exe 'dist/VST3/FM-1.vst3' | Tee-Object dist/VALIDATION.txt
          if ($LASTEXITCODE -ne 0) { throw 'VST3 validation failed' }
          if ((Get-Content dist/VALIDATION.txt -Raw) -notmatch 'Result: [1-9][0-9]* tests passed, 0 tests failed') { throw 'Validator did not report completed, successful plugin tests' }
      - name: Report build error context
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path msvc-build.log) {
            $Lines = (Get-Content msvc-build.log -Tail 30) -join ' | '
            $Lines = $Lines.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build context::$Lines"
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $CompilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $CompilerSetup
          if ((Get-FileHash $CompilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup download checksum mismatch' }
          $Signature = Get-AuthenticodeSignature $CompilerSetup
          if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Untrusted Inno Setup publisher signature' }
          $CompilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          $Process = Start-Process $CompilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$CompilerDir") -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw 'Inno Setup compiler installation failed' }
      - name: Package Windows installer
        shell: pwsh
        run: ./tools/package-windows.ps1 -Iscc (Join-Path $env:RUNNER_TEMP 'InnoSetup7/ISCC.exe')
      - name: Install, load plugin factory and uninstall
        shell: pwsh
        run: ./tools/smoke-installer.ps1
      - name: Package complete portable ZIP
        run: python tools/package-portable.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wave-FM-1-Windows-x64-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 14
