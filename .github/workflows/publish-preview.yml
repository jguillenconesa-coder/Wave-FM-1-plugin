name: Publish verified preview downloads
on:
  push:
    tags: ['v*-preview.*']
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  publish:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Wave-FM-1-Windows-x64-experimental
          path: verified-build
      - name: Verify native Windows downloads
        working-directory: verified-build/installer
        run: sha256sum --check SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: ${{ github.ref_name }}
        run: |
          [[ "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || exit 1
          version=${PREVIEW_TAG#v}
          version=${version%-preview.*}
          if ! gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release create "$PREVIEW_TAG" --verify-tag --prerelease --title "Wave FM-1 Preview $version" --notes-file docs/RELEASE_NOTES.md || gh release view "$PREVIEW_TAG" >/dev/null
          fi
          gh release edit "$PREVIEW_TAG" --prerelease --title "Wave FM-1 Preview $version" --notes-file docs/RELEASE_NOTES.md
          gh release upload "$PREVIEW_TAG" \
            "verified-build/installer/Wave-FM-1-$version-Windows-x64-Setup.exe" \
            "verified-build/installer/Wave-FM-1-$version-Windows-x64-Portable.zip" \
            verified-build/installer/SHA256SUMS \
            verified-build/installer/build-info-windows.json --clobber
